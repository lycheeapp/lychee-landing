<header class="site-nav" [class.legal-variant]="variant === 'legal'">
  <div class="wrap nav-in">
    <a class="brand" routerLink="/" aria-label="Lychee home" (click)="closeMenu()">
      <img class="logo-full" [src]="logoFullUrl" alt="Lychee" width="120" height="26" />
      <img class="logo-mark" [src]="logoMarkUrl" alt="Lychee" width="30" height="30" />
    </a>

    <nav class="nav-links" [attr.aria-label]="locale === 'ar' ? 'التنقل الرئيسي' : 'Main navigation'">
      <ng-container *ngFor="let link of links">
        <a *ngIf="isAppRoute(link.href)"
           [routerLink]="link.href"
           [class.is-active]="legalActive === link.href"
           (click)="onNavClick()">{{ t(link.label) }}</a>
        <a *ngIf="isFragment(link.href)"
           [routerLink]="'/'"
           [fragment]="fragmentOf(link.href)"
           (click)="onNavClick()">{{ t(link.label) }}</a>
        <a *ngIf="isExternal(link.href)"
           [href]="link.href"
           target="_blank"
           rel="noopener noreferrer"
           (click)="onNavClick()">{{ t(link.label) }}</a>
      </ng-container>
    </nav>

    <div class="nav-right">
      <button
        class="lang-btn"
        type="button"
        (click)="langToggle.emit()"
        [attr.aria-label]="locale === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2"/>
          <path d="M3.8 12h16.4M12 3.8c2.3 2.2 3.4 5.1 3.4 8.2S14.3 18 12 20.2C9.7 18 8.6 15.1 8.6 12S9.7 6 12 3.8Z"/>
        </svg>
        <span>{{ t(langLabel) }}</span>
      </button>

      <a *ngIf="cta && isExternal(cta.href)" class="btn btn-primary btn-sm nav-cta" [href]="cta.href" target="_blank" rel="noopener noreferrer">
        <span class="nav-cta-text">{{ t(cta.label) }}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a *ngIf="cta && isFragment(cta.href)" class="btn btn-primary btn-sm nav-cta" [routerLink]="'/'" [fragment]="fragmentOf(cta.href)">
        <span class="nav-cta-text">{{ t(cta.label) }}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
      <a *ngIf="cta && isAppRoute(cta.href)" class="btn btn-primary btn-sm nav-cta" [routerLink]="cta.href">
        <span class="nav-cta-text">{{ t(cta.label) }}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>

      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-nav-panel"
        [attr.aria-label]="menuOpen
          ? (locale === 'ar' ? 'إغلاق القائمة' : 'Close menu')
          : (locale === 'ar' ? 'فتح القائمة' : 'Open menu')">
        <span class="menu-bar" [class.open]="menuOpen"></span>
      </button>
    </div>
  </div>

  <ng-container *ngIf="menuOpen">
    <div
      class="mobile-backdrop"
      (click)="closeMenu()"
      aria-hidden="true"></div>

    <div
      id="mobile-nav-panel"
      class="mobile-drawer open"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="locale === 'ar' ? 'قائمة الجوال' : 'Mobile menu'">
      <nav class="mobile-links" [attr.aria-label]="locale === 'ar' ? 'تنقل الجوال' : 'Mobile navigation'">
        <ng-container *ngFor="let link of links">
          <a *ngIf="isAppRoute(link.href)" [routerLink]="link.href" (click)="onNavClick()">{{ t(link.label) }}</a>
          <a *ngIf="isFragment(link.href)" [routerLink]="'/'" [fragment]="fragmentOf(link.href)" (click)="onNavClick()">{{ t(link.label) }}</a>
          <a *ngIf="isExternal(link.href)" [href]="link.href" target="_blank" rel="noopener noreferrer" (click)="onNavClick()">{{ t(link.label) }}</a>
        </ng-container>
      </nav>
      <div class="mobile-actions">
        <button class="lang-btn" type="button" (click)="langToggle.emit(); closeMenu()">
          <span>{{ t(langLabel) }}</span>
        </button>
        <a *ngIf="cta && isExternal(cta.href)" class="btn btn-primary btn-block" [href]="cta.href" target="_blank" rel="noopener noreferrer" (click)="onNavClick()">
          {{ t(cta.label) }}
        </a>
        <a *ngIf="cta && isFragment(cta.href)" class="btn btn-primary btn-block" [routerLink]="'/'" [fragment]="fragmentOf(cta.href)" (click)="onNavClick()">
          {{ t(cta.label) }}
        </a>
        <a *ngIf="cta && isAppRoute(cta.href)" class="btn btn-primary btn-block" [routerLink]="cta.href" (click)="onNavClick()">
          {{ t(cta.label) }}
        </a>
      </div>
    </div>
  </ng-container>
</header>
<span class="sr-only" aria-live="polite">{{ locale === 'ar' ? 'اللغة: العربية' : 'Language: English' }}</span>
